[package]
name = "embed-agent-desktop"
version = "0.1.4"
description = "Embed Agent desktop shell"
authors = ["Embed Agent"]
edition = "2021"

[lib]
name = "embed_agent_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.0", features = [] }
url = "2"
